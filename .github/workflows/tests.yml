name: Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [ '8.4', '8.5' ]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The driver talks SOAP; without the extension every test errors on the WSDL.
          extensions: soap, intl
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Unit and conformance suites only: they answer from recorded envelopes and never reach
      # Mondial Relay. The Live suite needs credentials and is run by hand.
      - name: Run test suite
        run: composer test

      - name: Run PHPStan analysis
        run: composer analyse
